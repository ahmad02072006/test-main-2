<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Reel / Read
  </title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/></noscript>
  <link href="style.css" rel="stylesheet"/>
  <link href="../ui.css" rel="stylesheet"/>
 </head>
 <body>
  <main class="shell" id="main-content">
   <header class="atlas-page-header">
    <a class="brand" href=".">
     REEL
     <span>
      /
     </span>
     READ
    </a>
    <nav aria-label="Media categories">
     <button class="nav-button active" data-type="movie" type="button" aria-pressed="true">
      Movies
     </button>
     <button class="nav-button" data-type="book" type="button" aria-pressed="false">
      Books
     </button>
     <button class="list-button" id="list-button" type="button">
      My list
      <b id="list-count">
       0
      </b>
     </button>
    </nav>
   </header>
   <section class="masthead">
    <div>
     <p class="eyebrow">
      A PERSONAL INDEX OF STORIES
     </p>
     <h1>
      Find your
      <br/>
      <em>
       next world.
      </em>
     </h1>
    </div>
    <div class="search-block">
     <form id="destination-form" class="destination-search">
      <label for="destination-query">Get recommendations for a destination</label>
      <div class="search-row">
       <input id="destination-query" placeholder="Try Kyoto, Paris, or another place" type="search" autocomplete="off"/>
       <button type="submit" aria-label="Find destination recommendations">Find</button>
      </div>
     </form>
     <label for="search">
      Search titles, authors, or destination
     </label>
     <div class="search-row">
      <input id="search" placeholder="Try “Dune” or “quiet ambition”" type="search"/>
      <span>
       <span aria-hidden="true">⌕</span>
      </span>
     </div>
     <div class="filters">
      <select id="genre" aria-label="Filter by genre">
       <option value="">
        All genres
       </option>
       <option value="28">
        Action
       </option>
       <option value="35">
        Comedy
       </option>
       <option value="18">
        Drama
       </option>
       <option value="878">
        Science fiction
       </option>
      </select>
      <select id="year" aria-label="Filter by release year">
       <option value="">
        Any year
       </option>
       <option>
        2025
       </option>
       <option>
        2024
       </option>
       <option>
        2023
       </option>
       <option>
        2022
       </option>
      </select>
     </div>
    </div>
   </section>
   <section class="results-section">
    <div class="results-heading">
     <h2 id="results-title">
      Popular this week
     </h2>
     <span id="result-status" role="status" aria-live="polite">
      Loading a few good stories...
     </span>
    </div>
    <div class="results-grid" id="results">
    </div>
   </section>
   <aside aria-label="Your saved stories" aria-hidden="true" class="drawer" id="list-drawer" inert>
    <div class="drawer-head">
     <h2>
      Your list
     </h2>
     <button aria-label="Close list" id="close-list" type="button">
      ×
     </button>
    </div>
    <p class="drawer-note">
     Favorites, watchlist, and reading list saved on this device.
    </p>
    <div class="collection-tabs" role="group" aria-label="Saved media lists">
     <button type="button" data-collection-tab="favorites" aria-pressed="true">Favorites</button>
     <button type="button" data-collection-tab="watchlist" aria-pressed="false">Watchlist</button>
     <button type="button" data-collection-tab="reading" aria-pressed="false">Reading list</button>
    </div>
    <p id="saved-status" role="status" aria-live="polite"></p>
    <div id="saved-list">
    </div>
   </aside>
   <div aria-hidden="true" class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" inert>
    <div class="modal-card">
     <button aria-label="Close details" class="close" id="close-modal" type="button">
      ×
     </button>
     <div id="modal-content">
     </div>
    </div>
   </div>
   <footer>
    <span>
     REEL / READ
    </span>
    <span>
     Stories are better when chosen slowly.
    </span>
   </footer>
  </main>
  <script src="../ui.js" defer></script>
  <script src="app.js" type="module">
  </script>
 </body>
</html>
