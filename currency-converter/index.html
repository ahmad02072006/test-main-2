<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Rate / Currency Converter
  </title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://cdn.jsdelivr.net" rel="preconnect"/>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/></noscript>
  <link href="style.css" rel="stylesheet"/>
  <style>
   .brand{display:inline-flex;align-items:center;min-height:44px}
   input,select,.swap{min-width:44px;min-height:44px}
  </style>
  <link href="../ui.css" rel="stylesheet"/>
 </head>
 <body>
  <main class="shell" id="main-content">
   <header class="atlas-page-header">
    <a class="brand" href=".">
     <span>
      R/
     </span>
     Rate
    </a>
    <div class="header-note">
     CURRENCY INTELLIGENCE
     <i>
     </i>
     LIVE RATES
    </div>
   </header>
   <section class="intro">
    <p class="eyebrow">
     YOUR MONEY, IN MOTION
    </p>
    <h1>
     Know what
     <br/>
     <em>
      it’s worth.
     </em>
    </h1>
    <p>
     Clear conversion for the currencies that move with you.
    </p>
   </section>
   <section class="converter">
    <div class="amount-wrap">
     <label for="amount">
      Amount
     </label>
     <input id="amount" min="0" step="any" type="number" value="100"/>
    </div>
    <div class="currency-field">
     <label for="from">
      From
     </label>
     <select id="from">
      <option>
       USD
      </option>
      <option>
       EUR
      </option>
      <option>
       GBP
      </option>
      <option>
       JPY
      </option>
      <option>
       CAD
      </option>
      <option>
       AUD
      </option>
      <option>
       KRW
      </option>
      <option>
       UZS
      </option>
      <option>
       BTC
      </option>
      <option>
       ETH
      </option>
      <option>
       SOL
      </option>
     </select>
    </div>
    <button aria-label="Swap currencies" class="swap" id="swap" title="Swap currencies" type="button">
     ⇄
    </button>
    <div class="currency-field">
     <label for="to">
      To
     </label>
     <select id="to">
      <option>
       EUR
      </option>
      <option>
      USD
      </option>
      <option>
       GBP
      </option>
      <option>
       JPY
      </option>
      <option>
       CAD
      </option>
      <option>
       AUD
      </option>
      <option>
       KRW
      </option>
      <option>
       UZS
      </option>
      <option>
       BTC
      </option>
      <option>
       ETH
      </option>
      <option>
       SOL
      </option>
     </select>
    </div>
    <div class="result">
     <span id="result-label">
      100 USD equals
     </span>
     <strong id="result">
      —
     </strong>
     <span id="rate-note">
      Fetching current rate...
     </span>
    </div>
   </section>
   <p class="status" id="status" role="status" aria-live="polite">
   </p>
   <section class="trend">
    <div class="trend-heading">
     <div>
      <p class="eyebrow">
       MARKET PULSE / 7 DAYS
      </p>
      <h2>
       Recent movement
      </h2>
     </div>
     <span id="trend-pair">
      USD / EUR
     </span>
    </div>
    <div class="chart-wrap" aria-busy="false">
     <canvas id="rate-chart" role="img" aria-label="Line chart showing exchange rate movement over the last seven days">
     </canvas>
    </div>
   </section>
   <footer>
    <span>
     R/ RATE CONVERTER
    </span>
    <span>
     Rates by ExchangeRate-API + CoinGecko
    </span>
   </footer>
  </main>
  <script src="../ui.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer>
  </script>
  <script src="app.js" type="module">
  </script>
 </body>
</html>
